<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tes Minat & Bakat | Lembaga Psikotes</title>
    <!-- Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- html2canvas + jsPDF untuk PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Card Style */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h1 {
            color: #2e7d32;
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #1b5e20;
            font-size: 22px;
            margin-bottom: 20px;
            border-left: 4px solid #4caf50;
            padding-left: 15px;
        }

        h3 {
            color: #2e7d32;
            margin: 15px 0 10px 0;
        }

        /* Form Style */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4caf50;
        }

        /* Button Style */
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            box-shadow: 0 4px 15px rgba(76,175,80,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76,175,80,0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        /* Soal Style */
        .soal-item {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        .soal-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }

        .soal-number {
            display: inline-block;
            background: #4caf50;
            color: white;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 14px;
            margin-right: 10px;
        }

        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 16px;
            background: white;
            border-radius: 40px;
            border: 1px solid #ddd;
            transition: all 0.2s;
        }

        .option:hover {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .option input {
            width: auto;
            margin: 0;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            background: #e0e0e0;
            border-radius: 30px;
            height: 12px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            border-radius: 30px;
        }

        .progress-text {
            text-align: right;
            margin-top: 8px;
            font-size: 14px;
            color: #666;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        /* Grid untuk hasil */
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .info-card {
            background: linear-gradient(135deg, #f5f5f5, #fff);
            border-radius: 16px;
            padding: 20px;
            border-left: 5px solid #4caf50;
        }

        .badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 36px;
            font-weight: bold;
            color: #2e7d32;
        }

        canvas {
            max-height: 300px;
            width: 100%;
        }

        /* Admin Panel */
        .admin-login, .admin-dashboard {
            display: none;
        }

        .admin-login.show, .admin-dashboard.show {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #4caf50;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            width: auto;
            min-width: 150px;
        }

        /* Print PDF style */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .card {
                box-shadow: none;
                padding: 15px;
            }
            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .card { padding: 20px; }
            .options { gap: 10px; }
            .option { padding: 6px 12px; font-size: 14px; }
            .soal-text { font-size: 16px; }
            .nav-buttons { flex-direction: column; gap: 10px; }
            .btn { justify-content: center; }
        }

        /* Toggle password */
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ==================== SISWA PAGE ==================== -->
    <div id="siswaPage">
        <!-- Form Identitas -->
        <div id="formIdentitas" class="card">
            <h1>🧠 TES MINAT & BAKAT</h1>
            <p style="color: #666; margin-bottom: 25px;">Multiple Intelligences + RIASEC | Standar Psikotes untuk SMP/SMA</p>
            
            <div class="form-group">
                <label>📝 Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Contoh: Muhammad Hazalitsa Amin">
            </div>
            <div class="form-group">
                <label>🏫 Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: 9G / 11 IPA 2">
            </div>
            <div class="form-group">
                <label>🏢 Asal Sekolah</label>
                <input type="text" id="sekolah" placeholder="Contoh: SMPN 10 BEKASI">
            </div>
            <div class="form-group">
                <label>📍 Cabang</label>
                <input type="text" id="cabang" placeholder="Contoh: Bekasi Raya">
            </div>
            <button class="btn btn-primary" onclick="startTes()" style="width: 100%;">🚀 Mulai Tes</button>
            <div style="margin-top: 20px; text-align: center;">
                <button class="btn btn-secondary" onclick="showAdminLogin()">🔐 Login Admin</button>
            </div>
        </div>

        <!-- Halaman Tes -->
        <div id="halamanTes" style="display: none;">
            <div class="card">
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">Soal 0 / 0</div>
                </div>
                <div id="soalContainer"></div>
                <div class="nav-buttons">
                    <button class="btn btn-secondary" id="prevBtn" onclick="prevSoal()" disabled>◀ Sebelumnya</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextSoal()">Selanjutnya ▶</button>
                </div>
            </div>
        </div>

        <!-- Halaman Hasil -->
        <div id="halamanHasil" style="display: none;">
            <div class="card" id="hasilPrintArea">
                <div style="text-align: center; margin-bottom: 20px;">
                    <h1>📊 HASIL TES MINAT & BAKAT</h1>
                    <p id="hasilNama" style="font-size: 18px; color: #555;"></p>
                </div>
                <div id="hasilContainer"></div>
            </div>
            <div class="card no-print" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="printPDF()">🖨️ Print PDF</button>
                <button class="btn btn-secondary" onclick="resetToForm()">📝 Tes Lagi</button>
                <button class="btn btn-secondary" onclick="showAdminLogin()">🔐 Admin Panel</button>
            </div>
        </div>
    </div>

    <!-- ==================== ADMIN PAGE ==================== -->
    <div id="adminLogin" class="card" style="display: none;">
        <h1>🔐 Login Admin</h1>
        <div class="form-group">
            <label>Password</label>
            <div class="password-wrapper">
                <input type="password" id="adminPassword" placeholder="Masukkan password admin">
                <span class="toggle-password" onclick="togglePassword('adminPassword')">👁️</span>
            </div>
        </div>
        <button class="btn btn-primary" onclick="adminLogin()" style="width: 100%;">Login</button>
        <div style="margin-top: 15px; text-align: center;">
            <button class="btn btn-secondary" onclick="backToSiswa()">← Kembali ke Tes</button>
        </div>
    </div>

    <div id="adminDashboard" class="card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <h1>📋 Dashboard Admin</h1>
            <div>
                <button class="btn btn-secondary" onclick="refreshAdminData()">🔄 Refresh</button>
                <button class="btn btn-danger" onclick="adminLogout()">🚪 Logout</button>
            </div>
        </div>
        
        <div class="filter-bar">
            <input type="text" id="filterNama" placeholder="Filter nama..." onkeyup="filterAdminTable()">
            <input type="text" id="filterKelas" placeholder="Filter kelas..." onkeyup="filterAdminTable()">
            <select id="filterCabang" onchange="filterAdminTable()">
                <option value="">Semua Cabang</option>
            </select>
        </div>

        <div style="overflow-x: auto;">
            <table id="adminTable">
                <thead>
                    <tr><th>ID</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Cabang</th><th>Tipe MI</th><th>Tipe RIASEC</th><th>Aksi</th></tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn btn-secondary" onclick="backToSiswa()">← Kembali ke Beranda</button>
            <button class="btn btn-secondary" onclick="showChangePassword()">🔑 Ganti Password</button>
        </div>
    </div>

    <div id="changePasswordModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
        <div class="card" style="max-width: 400px; margin: 20px;">
            <h3>Ganti Password Admin</h3>
            <div class="form-group">
                <label>Password Lama</label>
                <input type="password" id="oldPassword">
            </div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassword">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password Baru</label>
                <input type="password" id="confirmPassword">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeChangePassword()">Batal</button>
                <button class="btn btn-primary" onclick="updatePassword()">Update</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ==================== KONFIGURASI ====================
    // GANTI URL_INI dengan URL Apps Script kamu!
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw40uabGJAKyNTrousH_B8CFerdWsGme8amhfsLubTdugwgZcCT88pKC3OY07nvg8Ge/exec";
    
    let soalList = [];
    let jawabanSiswa = [];
    let currentSoalIndex = 0;
    let idSiswa = "";
    let adminToken = "";
    let chartInstance = null;
    
    // Data siswa sementara
    let siswaData = {
        nama: "",
        kelas: "",
        sekolah: "",
        cabang: ""
    };
    
    // ==================== UTILITY FUNCTIONS ====================
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#f44336' : '#4caf50';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function togglePassword(fieldId) {
        let field = document.getElementById(fieldId);
        field.type = field.type === 'password' ? 'text' : 'password';
    }
    
    // ==================== SISWA FUNCTIONS ====================
    async function startTes() {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value.trim();
        const sekolah = document.getElementById('sekolah').value.trim();
        const cabang = document.getElementById('cabang').value.trim();
        
        if (!nama || !kelas || !sekolah || !cabang) {
            showToast("Harap isi semua data!", true);
            return;
        }
        
        siswaData = { nama, kelas, sekolah, cabang };
        
        // Load soal dari API
        showToast("Memuat soal...");
        try {
            const response = await fetch(`${APPS_SCRIPT_URL}?action=getSoal`);
            const data = await response.json();
            if (data.success && data.data) {
                soalList = data.data;
                jawabanSiswa = new Array(soalList.length).fill(null);
                currentSoalIndex = 0;
                
                // Sembunyikan form, tampilkan tes
                document.getElementById('formIdentitas').style.display = 'none';
                document.getElementById('halamanTes').style.display = 'block';
                document.getElementById('halamanHasil').style.display = 'none';
                
                updateProgress();
                renderSoal();
                showToast(`✅ ${soalList.length} soal siap!`);
            } else {
                showToast("Gagal memuat soal!", true);
            }
        } catch (err) {
            showToast("Error: " + err.message, true);
        }
    }
    
    function renderSoal() {
        const container = document.getElementById('soalContainer');
        if (!soalList[currentSoalIndex]) return;
        
        const soal = soalList[currentSoalIndex];
        const jawaban = jawabanSiswa[currentSoalIndex];
        
        let html = `
            <div class="soal-item">
                <div class="soal-text">
                    <span class="soal-number">Soal ${currentSoalIndex + 1}</span>
                    ${escapeHtml(soal.pertanyaan)}
                </div>
                <div class="options">
                    ${[1,2,3,4,5].map(nilai => `
                        <label class="option">
                            <input type="radio" name="jawaban" value="${nilai}" ${jawaban === nilai ? 'checked' : ''} onchange="setJawaban(${nilai})">
                            ${nilai === 1 ? 'Sangat Tidak Setuju' : nilai === 2 ? 'Tidak Setuju' : nilai === 3 ? 'Netral' : nilai === 4 ? 'Setuju' : 'Sangat Setuju'}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        container.innerHTML = html;
        
        // Update tombol navigasi
        document.getElementById('prevBtn').disabled = currentSoalIndex === 0;
        const nextBtn = document.getElementById('nextBtn');
        if (currentSoalIndex === soalList.length - 1) {
            nextBtn.innerHTML = "✅ Selesai";
            nextBtn.onclick = finishTes;
        } else {
            nextBtn.innerHTML = "Selanjutnya ▶";
            nextBtn.onclick = nextSoal;
        }
    }
    
    function setJawaban(nilai) {
        jawabanSiswa[currentSoalIndex] = nilai;
    }
    
    function nextSoal() {
        if (jawabanSiswa[currentSoalIndex] === null) {
            showToast("Harap pilih jawaban terlebih dahulu!", true);
            return;
        }
        if (currentSoalIndex < soalList.length - 1) {
            currentSoalIndex++;
            renderSoal();
            updateProgress();
        }
    }
    
    function prevSoal() {
        if (currentSoalIndex > 0) {
            currentSoalIndex--;
            renderSoal();
            updateProgress();
        }
    }
    
    function updateProgress() {
        const answered = jawabanSiswa.filter(j => j !== null).length;
        const percent = (answered / soalList.length) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressText').innerHTML = `Soal ${currentSoalIndex + 1} / ${soalList.length} | Terjawab: ${answered}`;
    }
    
    async function finishTes() {
        // Cek semua soal sudah dijawab
        const unanswered = jawabanSiswa.filter(j => j === null).length;
        if (unanswered > 0) {
            showToast(`Masih ada ${unanswered} soal yang belum dijawab!`, true);
            return;
        }
        
        showToast("Menyimpan hasil tes...");
        
        const payload = {
            action: "submitTes",
            nama: siswaData.nama,
            kelas: siswaData.kelas,
            asal_sekolah: siswaData.sekolah,
            cabang: siswaData.cabang,
            jawaban: soalList.map((soal, idx) => ({
                id_soal: soal.id,
                nilai: jawabanSiswa[idx]
            }))
        };
        
        try {
            const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            
            // Karena mode no-cors, kita tidak bisa baca response langsung
            // Tapi data sudah tersimpan di spreadsheet
            // Untuk demo, kita akan ambil dari spreadsheet via GET setelah beberapa saat
            showToast("Tes selesai! Menampilkan hasil...");
            
            // Simulasi: tunggu 1 detik lalu tampilkan hasil dari spreadsheet
            setTimeout(async () => {
                // Ambil data siswa terakhir (alternatif: kita generate ID lokal dulu)
                // Untuk keperluan demo, kita tampilkan hasil berdasarkan jawaban
                const hasil = hitungHasilLokal();
                tampilkanHasil(hasil, siswaData);
                document.getElementById('halamanTes').style.display = 'none';
                document.getElementById('halamanHasil').style.display = 'block';
            }, 1500);
            
        } catch (err) {
            showToast("Error: " + err.message, true);
        }
    }
    
    function hitungHasilLokal() {
        // Hitung skor per tipe MI
        const skorMi = {
            "Visual-Spatial": 0,
            "Logical-Mathematical": 0,
            "Linguistic": 0,
            "Musical": 0,
            "Interpersonal": 0,
            "Intrapersonal": 0,
            "Kinesthetic": 0,
            "Naturalist": 0
        };
        const countMi = {...skorMi};
        
        const skorRiasec = {
            "Realistic": 0,
            "Investigative": 0,
            "Artistic": 0,
            "Social": 0,
            "Enterprising": 0,
            "Conventional": 0
        };
        const countRiasec = {...skorRiasec};
        
        for (let i = 0; i < soalList.length; i++) {
            const soal = soalList[i];
            const nilai = jawabanSiswa[i];
            if (soal.tipeMi) {
                skorMi[soal.tipeMi] += nilai;
                countMi[soal.tipeMi]++;
            }
            if (soal.tipeRiasec) {
                skorRiasec[soal.tipeRiasec] += nilai;
                countRiasec[soal.tipeRiasec]++;
            }
        }
        
        // Rata-rata
        for (let t in skorMi) {
            if (countMi[t] > 0) skorMi[t] = Math.round((skorMi[t] / countMi[t]) * 100) / 100;
        }
        for (let t in skorRiasec) {
            if (countRiasec[t] > 0) skorRiasec[t] = Math.round((skorRiasec[t] / countRiasec[t]) * 100) / 100;
        }
        
        // Cari tertinggi
        let tipeMiTertinggi = "";
        let skorMiTertinggi = 0;
        for (let [t, s] of Object.entries(skorMi)) {
            if (s > skorMiTertinggi) { skorMiTertinggi = s; tipeMiTertinggi = t; }
        }
        
        let tipeRiasecTertinggi = "";
        let skorRiasecTertinggi = 0;
        for (let [t, s] of Object.entries(skorRiasec)) {
            if (s > skorRiasecTertinggi) { skorRiasecTertinggi = s; tipeRiasecTertinggi = t; }
        }
        
        // Mapping rekomendasi sederhana
        const mappingMi = {
            "Visual-Spatial": { pekerjaan: "Arsitek, Desainer Grafis, Pilot, Fotografer", jurusan_sma: "Saintek", jurusan_kuliah: "Arsitektur, DKV", ciri: "Belajar lewat visual dan gambar", optimasi: "Gambar, mind mapping, puzzle spasial" },
            "Logical-Mathematical": { pekerjaan: "Programmer, Analis, Ilmuwan, Aktuaris", jurusan_sma: "Saintek", jurusan_kuliah: "Matematika, Informatika, Statistika", ciri: "Berpikir logis dan sistematis", optimasi: "Logika, coding, catur" },

        return {

            }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function tampilkanHasil(hasil, dataSiswa) {
        const container = document.getElementById('hasilContainer');
        document.getElementById('hasilNama').innerHTML = `<strong>${escapeHtml(dataSiswa.nama)}</strong> | Kelas: ${escapeHtml(dataSiswa.kelas)} | ${escapeHtml(dataSiswa.sekolah)} | Cabang: ${escapeHtml(dataSiswa.cabang)}`;
        
        const skorMi = hasil.semua_skor_mi;
        const miLabels = Object.keys(skorMi);
        const miValues = Object.values(skorMi);
        
        let html = `
            <div style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px;">
                <div class="badge">🎯 TIPE KECERDASAN DOMINAN</div>
                <div style="font-size: 48px; font-weight: bold; color: #2e7d32;">${hasil.tipe_mi_tertinggi}</div>
                <div style="font-size: 20px;">Skor: ${hasil.skor_mi_tertinggi} / 5.00</div>
                <div style="margin-top: 10px; color: #555;">Tipe RIASEC: ${hasil.tipe_riasec_tertinggi} (Skor: ${hasil.skor_riasec_tertinggi})</div>
            </div>
            
            <div class="result-grid">
                <div class="info-card">
                    <div class="badge">💼 Pekerjaan yang Sesuai</div>
                    <p>${hasil.rekomendasi.pekerjaan}</p>
                </div>
                <div class="info-card">
                    <div class="badge">🏫 Jurusan SMA</div>
                    <p>${hasil.rekomendasi.jurusan_sma}</p>
                </div>
                <div class="info-card">
                    <div class="badge">🎓 Jurusan Kuliah</div>
                    <p>${hasil.rekomendasi.jurusan_kuliah}</p>
                </div>
                <div class="info-card">
                    <div class="badge">📖 Ciri Umum</div>
                    <p>${hasil.rekomendasi.ciri_umum}</p>
                </div>
                <div class="info-card">
                    <div class="badge">⚡ Cara Mengoptimalkan</div>
                    <p>${hasil.rekomendasi.cara_optimasi}</p>
                </div>
            </div>
            
            <div style="margin-top: 25px;">
                <h3>📊 Grafik Skor Kecerdasan (Multiple Intelligences)</h3>
                <canvas id="skorChart" style="max-height: 350px;"></canvas>
            </div>
        `;
        container.innerHTML = html;
        
        // Render chart
        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('skorChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: miLabels,
                datasets: [{
                    label: 'Skor (1-5)',
                    data: miValues,
                    backgroundColor: 'rgba(76, 175, 80, 0.7)',
                    borderColor: '#2e7d32',
                    borderWidth: 1,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                scales: { y: { min: 0, max: 5, title: { display: true, text: 'Skor' } } },
                plugins: { legend: { position: 'top' } }
            }
        });
    }
    
    async function printPDF() {
        const element = document.getElementById('hasilPrintArea');
        const originalTitle = document.title;
        document.title = `Hasil_Tes_${siswaData.nama}`;
        
        try {
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
            pdf.save(`Hasil_Tes_${siswaData.nama}.pdf`);
        } catch (err) {
            showToast("Gagal generate PDF: " + err.message, true);
        }
        document.title = originalTitle;
    }

    }

    function renderAdminTable(data) {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        for (const row of data) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id_siswa || '-'}</td>
                <td>${escapeHtml(row.nama || '-')}</td>
                <td>${escapeHtml(row.kelas || '-')}</td>
                <td>${escapeHtml(row.asal_sekolah || '-')}</td>
                <td>${escapeHtml(row.cabang || '-')}</td>
                <td>${row.tipe_mi_tertinggi || '-'}</td>
                <td>${row.tipe_riasec_tertinggi || '-'}</td>
                <td><button class="btn btn-secondary" style="padding: 6px 12px;" onclick="viewLaporan('${row.id_siswa}', '${escapeHtml(row.nama)}')">📄 Lihat</button></td>
            `;
            tbody.appendChild(tr);
        }
    }
    
    function populateFilterOptions(data) {
        const cabangSet = new Set();
        for (const row of data) if (row.cabang) cabangSet.add(row.cabang);
        const select = document.getElementById('filterCabang');
        select.innerHTML = '<option value="">Semua Cabang</option>';
        for (const c of cabangSet) {
            select.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
        }
    }
    
    function filterAdminTable() {
        const filterNama = document.getElementById('filterNama').value.toLowerCase();
        const filterKelas = document.getElementById('filterKelas').value.toLowerCase();
        const filterCabang = document.getElementById('filterCabang').value;
        const rows = document.querySelectorAll('#adminTable tbody tr');
        for (const row of rows) {
            const nama = row.cells[1]?.innerText.toLowerCase() || '';
            const kelas = row.cells[2]?.innerText.toLowerCase() || '';
            const cabang = row.cells[4]?.innerText || '';
            let show = true;
            if (filterNama && !nama.includes(filterNama)) show = false;
            if (filterKelas && !kelas.includes(filterKelas)) show = false;
            if (filterCabang && cabang !== filterCabang) show = false;
            row.style.display = show ? '' : 'none';
        }
    }

    async function updatePassword() {
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        
        if (newPwd !== confirmPwd) {
            showToast("Password baru tidak cocok!", true);
            return;
        }
        if (newPwd.length < 4) {
            showToast("Password minimal 4 karakter!", true);
            return;
        }
        
        try {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "updatePassword", password_baru: newPwd, admin_token: oldPwd })
            });
            showToast("Password berhasil diupdate!");
            closeChangePassword();
        } catch (err) {
            showToast("Gagal update password: " + err.message, true);
        }
    }
