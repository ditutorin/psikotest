<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PsikoRouter | Tes Minat & Bakat</title>
    
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f7f0;
            min-height: 100vh;
            color: #333;
        }

        /* ==================== WELCOME SCREEN ==================== */
        .welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(27, 94, 32, 0.85), rgba(27, 94, 32, 0.95)), 
                        url('https://images.unsplash.com/photo-1523050854058-8df90110c8f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; z-index: 9999; color: white;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .welcome-screen.hide { opacity: 0; transform: scale(1.1); pointer-events: none; }
        .welcome-logo { font-size: 4rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
        .welcome-title { font-size: 3rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: 1px; }
        .welcome-tagline { font-size: 1.2rem; font-weight: 300; margin-bottom: 3rem; max-width: 600px; opacity: 0.9; }
        .btn-explore {
            padding: 18px 40px; font-size: 1.2rem; font-weight: 600; color: #1b5e20;
            background: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: all 0.3s;
            display: inline-flex; align-items: center; gap: 12px;
        }
        .btn-explore:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.4); background: #f1f8e9; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* ==================== MAIN CONTAINER ==================== */
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .card {
            background: white; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(46, 125, 50, 0.08);
            padding: 35px; margin-bottom: 25px; border: 1px solid rgba(46, 125, 50, 0.1);
        }
        
        /* ==================== TYPOGRAPHY ==================== */
        h1 { color: #2e7d32; font-size: 26px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; font-weight: 700; }
        h2 { color: #1b5e20; font-size: 20px; margin-bottom: 20px; padding-left: 15px; border-left: 5px solid #4caf50; font-weight: 600; }
        
        /* ==================== FORMS ==================== */
        .form-group { margin-bottom: 22px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #2e7d32; font-size: 14px; }
        input, select {
            width: 100%; padding: 14px 18px; border: 2px solid #e0e0e0;
            border-radius: 14px; font-size: 16px; font-family: 'Poppins', sans-serif;
            transition: all 0.3s; background: #fafafa;
        }
        input:focus, select:focus { outline: none; border-color: #4caf50; background: white; box-shadow: 0 0 0 4px rgba(76,175,80,0.1); }
        
        /* ==================== BUTTONS ==================== */
        .btn {
            padding: 14px 28px; border: none; border-radius: 14px; font-size: 16px;
            font-weight: 600; cursor: pointer; transition: all 0.3s;
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4caf50, #2e7d32); color: white;
            box-shadow: 0 8px 20px rgba(76,175,80,0.3);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(76,175,80,0.4); }
        .btn-secondary { background: white; color: #2e7d32; border: 2px solid #c8e6c9; }
        .btn-secondary:hover { background: #e8f5e9; border-color: #a5d6a7; }
        .btn-danger { background: #ef5350; color: white; box-shadow: 0 8px 20px rgba(244,67,54,0.2); }
        .btn-danger:hover { background: #d32f2f; }
        .btn-icon { width: 50px; height: 50px; padding: 0; border-radius: 50%; font-size: 20px; }

        /* ==================== TES AREA ==================== */
        .progress-container { margin-bottom: 30px; }
        .progress-bar { background: #e0e0e0; border-radius: 30px; height: 14px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #66bb6a, #2e7d32); height: 100%; width: 0%; transition: width 0.4s ease; border-radius: 30px; }
        .progress-text { text-align: right; margin-top: 10px; font-size: 13px; color: #666; font-weight: 500; }

        .soal-item {
            background: #f1f8e9; border-radius: 20px; padding: 30px;
            border: 1px solid #dcedc8; animation: fadeIn 0.4s ease;
        }
        .soal-text { font-size: 18px; font-weight: 500; margin-bottom: 25px; color: #333; line-height: 1.6; }
        .soal-number {
            display: inline-flex; align-items: center; justify-content: center;
            background: #2e7d32; color: white; border-radius: 12px;
            padding: 6px 14px; font-size: 14px; margin-right: 10px; font-weight: 700;
        }
        
        .options { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .option {
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            padding: 16px 20px; background: white; border-radius: 16px;
            border: 2px solid #e0e0e0; transition: all 0.2s; position: relative; overflow: hidden;
        }
        .option:hover { border-color: #81c784; background: #fafafa; }
        .option.selected { border-color: #4caf50; background: #e8f5e9; }
        .option input[type="radio"] { display: none; }
        .checkmark {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #bdbdbd;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: all 0.2s;
        }
        .option.selected .checkmark { border-color: #2e7d32; background: #2e7d32; }
        .option.selected .checkmark::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; font-size: 12px; }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }

        /* ==================== HASIL ==================== */
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .info-card { background: linear-gradient(135deg, #f1f8e9, #fff); border-radius: 20px; padding: 25px; border-left: 6px solid #4caf50; }
        .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
        .score-value { font-size: 36px; font-weight: 800; color: #2e7d32; }
        canvas { max-height: 300px; width: 100% !important; }
        
        /* Custom Card Hasil */
        .motivation-card {
            background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white;
            border-radius: 20px; padding: 30px; margin-top: 25px; position: relative; overflow: hidden;
        }
        .motivation-card::before {
            content: '\201C'; position: absolute; top: -10px; left: 15px;
            font-size: 120px; color: rgba(255,255,255,0.1); font-family: serif;
        }
        .motivation-text { font-size: 18px; font-style: italic; line-height: 1.6; margin-bottom: 15px; position: relative; z-index: 1; }
        .role-model-badge {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.2);
            padding: 8px 16px; border-radius: 30px; font-size: 14px; font-weight: 500;
        }

        /* ==================== ADMIN ==================== */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; font-size: 14px; }
        th, td { padding: 14px; text-align: left; }
        th { background: #2e7d32; color: white; font-weight: 600; }
        th:first-child { border-radius: 12px 0 0 0; }
        th:last-child { border-radius: 0 12px 0 0; }
        tr:nth-child(even) { background: #f9fbe7; }
        tr:hover { background: #e8f5e9; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { width: auto; min-width: 180px; border-radius: 10px; border: 1px solid #c8e6c9; }
        
        .password-wrapper { position: relative; }
        .toggle-password { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; }
        
        .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }

        /* ==================== MODAL LAPORAN UNTUK ADMIN ==================== */
        .modal-laporan {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
            z-index: 1100; overflow-y: auto; padding: 20px;
        }
        .modal-laporan .modal-content {
            max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto;
            background: white; border-radius: 28px; padding: 30px;
        }

        /* ==================== UTILITIES ==================== */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: white; padding: 14px 28px; border-radius: 50px;
            z-index: 2000; animation: slideUp 0.3s ease; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 20px; }
        .spinner { width: 50px; height: 50px; border: 5px solid #e0e0e0; border-top-color: #2e7d32; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .welcome-title { font-size: 2.2rem; }
            .welcome-tagline { font-size: 1rem; }
            .btn-explore { padding: 14px 30px; font-size: 1rem; }
            .container { padding: 15px; }
            .card { padding: 20px; }
            .soal-text { font-size: 16px; }
            .option { padding: 12px 16px; font-size: 14px; }
            .btn { width: 100%; }
            table { font-size: 12px; }
            th, td { padding: 10px; }
            .motivation-text { font-size: 16px; }
            .modal-laporan .modal-content { padding: 20px; }
            .modal-laporan .result-grid { grid-template-columns: 1fr; }
        }

        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .card { box-shadow: none; padding: 0; border: none; }
            .result-grid { grid-template-columns: 1fr; }
            .modal-laporan { position: relative; background: none; padding: 0; }
            .modal-laporan .modal-content { max-height: none; border-radius: 0; padding: 0; }
        }
    </style>
</head>
<body>

<!-- ==================== WELCOME SCREEN ==================== -->
<div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-logo"><i class="fa-solid fa-brain"></i></div>
    <h1 class="welcome-title">PsikoRouter</h1>
    <p class="welcome-tagline">Menghubungkan kamu ke masa depan gemilang</p>
    <button class="btn-explore" onclick="hideWelcome()">
        Mari Mulai <i class="fa-solid fa-arrow-right"></i>
    </button>
</div>

<div class="container">
    <!-- ==================== SISWA PAGE ==================== -->
    <div id="siswaPage">
        <div id="formIdentitas" class="card">
            <h1><i class="fa-solid fa-brain" style="color:#4caf50"></i> PsikoRouter</h1>
            <p style="color: #666; margin-bottom: 25px; font-size: 14px;">Multiple Intelligences + RIASEC | Standar Psikotes SMP/SMA</p>
            
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Contoh: Muhammad Hazalitsa Amin">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-school"></i> Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: 9G / 11 IPA 2">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-building-columns"></i> Asal Sekolah</label>
                <input type="text" id="sekolah" placeholder="Contoh: SMPN 10 BEKASI">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-map-location-dot"></i> Cabang</label>

                        <i class="fa-solid fa-chevron-left"></i> Kembali
                    </button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextSoal()">

                    </button>
                </div>
            </div>
        </div>
       
    </div>

    <!-- ==================== ADMIN PAGE ==================== -->
    <div id="adminLogin" class="card" style="display: none;">

            </div>
        </div>
        <button class="btn btn-primary" onclick="adminLogin()" style="width: 100%;"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        <div style="margin-top: 15px; text-align: center;">
            <button class="btn btn-secondary" onclick="backToSiswa()" style="font-size: 14px;"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</button>
        </div>
    </div>

    <div id="adminDashboard" class="card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <h1 style="margin-bottom: 0;"><i class="fa-solid fa-database"></i> Dashboard Admin</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary btn-icon" onclick="refreshAdminData()" title="Refresh"><i class="fa-solid fa-sync"></i></button>
                <button class="btn btn-danger btn-icon" onclick="adminLogout()" title="Logout"><i class="fa-solid fa-sign-out-alt"></i></button>
            </div>
        </div>
        
        <div class="filter-bar">
            <input type="text" id="filterNama" placeholder="Cari nama..." onkeyup="filterAdminTable()">
            <input type="text" id="filterKelas" placeholder="Cari kelas..." onkeyup="filterAdminTable()">
            <select id="filterCabang" onchange="filterAdminTable()">
                <option value="">Semua Cabang</option>
            </select>
        </div>

        <div style="overflow-x: auto; border-radius: 12px; border: 1px solid #c8e6c9;">
            <table id="adminTable">
                <thead>
                    <tr><th>ID</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Cabang</th><th>Tipe MI</th><th>Tipe RIASEC</th><th>Aksi</th></tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="backToSiswa()"><i class="fa-solid fa-home"></i> Beranda</button>
            <button class="btn btn-secondary" onclick="showChangePassword()"><i class="fa-solid fa-key"></i> Ganti Password</button>
        </div>
    </div>

    <div id="changePasswordModal" class="modal-bg">
        <div class="card" style="max-width: 400px; width: 90%;">
            <h3><i class="fa-solid fa-key"></i> Ganti Password</h3>
            <div class="form-group" style="margin-top: 20px;">
                <label>Password Lama</label>
                <input type="password" id="oldPassword">
            </div>
            <div class="form-group">
                <label>Password Baru</label>
                <input type="password" id="newPassword">
            </div>
            <div class="form-group">
                <label>Konfirmasi Password</label>
                <input type="password" id="confirmPassword">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn btn-secondary" onclick="closeChangePassword()">Batal</button>
                <button class="btn btn-primary" onclick="updatePassword()">Update</button>
            </div>
        </div>
    </div>

    <!-- ==================== MODAL LAPORAN UNTUK ADMIN (PRINT PDF) ==================== -->
    <div id="modalLaporan" class="modal-laporan">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;" class="no-print">
                <h2 style="margin-bottom:0;"><i class="fa-solid fa-file-alt"></i> Laporan Siswa</h2>
                <button class="btn btn-secondary btn-icon" onclick="closeModalLaporan()" style="width: 40px; height: 40px;"><i class="fa-solid fa-times"></i></button>
            </div>
            <div id="modalLaporanContent"></div>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 25px;" class="no-print">
                <button class="btn btn-primary" onclick="printModalLaporan()"><i class="fa-solid fa-print"></i> Cetak PDF</button>
                <button class="btn btn-secondary" onclick="closeModalLaporan()">Tutup</button>
            </div>
        </div>
    </div>
</div>

    // ==================== WELCOME & UTILITY ====================
    function hideWelcome() {
        document.getElementById('welcomeScreen').classList.add('hide');
        setTimeout(() => { document.getElementById('welcomeScreen').style.display = 'none'; }, 800);
    }

    function showLoading(show) {
        let loading = document.getElementById('loadingOverlay');
        if (!loading && show) {
            loading = document.createElement('div');
            loading.id = 'loadingOverlay';
            loading.className = 'loading-overlay';
            loading.innerHTML = '<div class="spinner"></div><p style="font-weight:600; color:#2e7d32">Menyimpan jawaban...</p>';
            document.body.appendChild(loading);
        } else if (loading && !show) {
            loading.remove();
        }
    }
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = isError ? '#ef5350' : '#2e7d32';
        toast.innerHTML = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function togglePassword(fieldId) {
        let field = document.getElementById(fieldId);
        let icon = field.nextElementSibling.querySelector('i');
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    // ==================== SISWA FUNCTIONS ====================
    async function startTes() {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value.trim();
        const sekolah = document.getElementById('sekolah').value.trim();
        const cabang = document.getElementById('cabang').value.trim();
        
        if (!nama || !kelas || !sekolah || !cabang) {
            showToast("<i class='fa-solid fa-circle-exclamation'></i> Harap isi semua data!", true);
            return;
        }
        
        siswaData = { nama, kelas, sekolah, cabang };
        
        showToast("<i class='fa-solid fa-spinner fa-spin'></i> Memuat soal...");
        try {
            const response = await fetch(`${APPS_SCRIPT_URL}?action=getSoal`);
            const data = await response.json();
            if (data.success && data.data) {
                soalList = data.data;
                jawabanSiswa = new Array(soalList.length).fill(null);
                currentSoalIndex = 0;
                
                document.getElementById('formIdentitas').style.display = 'none';
                document.getElementById('halamanTes').style.display = 'block';
                document.getElementById('halamanHasil').style.display = 'none';
                
                updateProgress();
                renderSoal();
                showToast(`<i class='fa-solid fa-circle-check'></i> ${soalList.length} soal siap!`);
            } else {
                showToast("Gagal memuat soal!", true);
            }
        } catch (err) {
            showToast("Error: " + err.message, true);
        }
    }
    
    function renderSoal() {
        if (!soalList[currentSoalIndex]) return;
        
        const soal = soalList[currentSoalIndex];
        const jawaban = jawabanSiswa[currentSoalIndex];
        
        const labels = {
            1: 'Sangat Tidak Setuju', 2: 'Tidak Setuju', 
            3: 'Netral', 4: 'Setuju', 5: 'Sangat Setuju'
        };
        
        let html = `
            <div class="soal-item">
                <div class="soal-text">
                    <span class="soal-number">${currentSoalIndex + 1}</span>
                    ${escapeHtml(soal.pertanyaan)}
                </div>
                <div class="options">
                    ${[1,2,3,4,5].map(nilai => `
                        <label class="option ${jawaban === nilai ? 'selected' : ''}" onclick="setJawaban(${nilai}, this)">
                            <input type="radio" name="jawaban" value="${nilai}" ${jawaban === nilai ? 'checked' : ''}>
                            <div class="checkmark"></div>
                            <span>${labels[nilai]}</span>
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        document.getElementById('soalContainer').innerHTML = html;
        
        document.getElementById('prevBtn').disabled = currentSoalIndex === 0;
        const nextBtn = document.getElementById('nextBtn');
        if (currentSoalIndex === soalList.length - 1) {
            nextBtn.innerHTML = "Selesai <i class='fa-solid fa-check'></i>";
            nextBtn.onclick = () => finishTes();
        } else {
            nextBtn.innerHTML = "Lanjut <i class='fa-solid fa-chevron-right'></i>";
            nextBtn.onclick = nextSoal;
        }
    }
    
    function setJawaban(nilai, element) {
        jawabanSiswa[currentSoalIndex] = nilai;
        const options = element.parentElement.querySelectorAll('.option');
        options.forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');
    }
    
    function nextSoal() {
        if (jawabanSiswa[currentSoalIndex] === null) {
            showToast("<i class='fa-solid fa-circle-exclamation'></i> Pilih jawaban terlebih dahulu!", true);
            return;
        }
        if (currentSoalIndex < soalList.length - 1) {
            currentSoalIndex++;
            renderSoal();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function prevSoal() {
        if (currentSoalIndex > 0) {
            currentSoalIndex--;
            renderSoal();
            updateProgress();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
    
    function updateProgress() {
        const answered = jawabanSiswa.filter(j => j !== null).length;
        const percent = (answered / soalList.length) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
        document.getElementById('progressText').innerHTML = `Soal ${currentSoalIndex + 1} / ${soalList.length} | Terjawab: ${answered}`;
    }
    
    async function finishTes() {
    if (isSubmitting) return;
    
    const unanswered = jawabanSiswa.filter(j => j === null).length;
    if (unanswered > 0) {
        showToast(`<i class='fa-solid fa-circle-exclamation'></i> Masih ada ${unanswered} soal belum dijawab!`, true);
        return;
    }
    
    isSubmitting = true;
    showLoading(true);
    
    const hasil = hitungHasilLokal();
    
    const payload = {
        action: "submitTes",
        nama: siswaData.nama,
        kelas: siswaData.kelas,
        asal_sekolah: siswaData.sekolah,
        cabang: siswaData.cabang,
        jawaban: soalList.map((soal, idx) => ({
            id_soal: soal.id,
            nilai: jawabanSiswa[idx]
        })),
        tipe_mi_tertinggi: hasil.tipe_mi_tertinggi,
        tipe_riasec_tertinggi: hasil.tipe_riasec_tertinggi,
        skor_mi_json: JSON.stringify(hasil.semua_skor_mi),
        skor_riasec_json: JSON.stringify(hasil.semua_skor_riasec)
    };
    
    try {
        await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        
        showToast("<i class='fa-solid fa-circle-check'></i> Tes selesai! Terima kasih.");
        
        // ✅ LANGSUNG RESET KE FORM AWAL (TANPA TAMPILKAN HASIL)
        resetToForm();
        
    } catch (err) {
        showToast("Error: " + err.message, true);
    } finally {
        isSubmitting = false;
        showLoading(false);
    }
}
    
    function hitungHasilLokal() {
        const skorMi = {
            "Visual-Spatial": 0, "Logical-Mathematical": 0, "Linguistic": 0,
            "Musical": 0, "Interpersonal": 0, "Intrapersonal": 0, "Kinesthetic": 0, "Naturalist": 0
        };
        const countMi = { ...skorMi };
        
        const skorRiasec = {
            "Realistic": 0, "Investigative": 0, "Artistic": 0,
            "Social": 0, "Enterprising": 0, "Conventional": 0
        };
        const countRiasec = { ...skorRiasec };
        
        for (let i = 0; i < soalList.length; i++) {
            const soal = soalList[i];
            const nilai = jawabanSiswa[i];
            if (soal.tipeMi && skorMi[soal.tipeMi] !== undefined) {
                skorMi[soal.tipeMi] += nilai;
                countMi[soal.tipeMi]++;
            }
            if (soal.tipeRiasec && skorRiasec[soal.tipeRiasec] !== undefined) {
                skorRiasec[soal.tipeRiasec] += nilai;
                countRiasec[soal.tipeRiasec]++;
            }
        }
        
        for (let t in skorMi) {
            if (countMi[t] > 0) skorMi[t] = Math.round((skorMi[t] / countMi[t]) * 100) / 100;
        }
        for (let t in skorRiasec) {
            if (countRiasec[t] > 0) skorRiasec[t] = Math.round((skorRiasec[t] / countRiasec[t]) * 100) / 100;
        }
        
        let tipeMiTertinggi = "";
        let skorMiTertinggi = 0;
        for (let [t, s] of Object.entries(skorMi)) {
            if (s > skorMiTertinggi) { skorMiTertinggi = s; tipeMiTertinggi = t; }
        }
        
        let tipeRiasecTertinggi = "";
        let skorRiasecTertinggi = 0;
        for (let [t, s] of Object.entries(skorRiasec)) {
            if (s > skorRiasecTertinggi) { skorRiasecTertinggi = s; tipeRiasecTertinggi = t; }
        }
        
        const rekom = mappingMi[tipeMiTertinggi] || mappingMi["Visual-Spatial"];
        
        return {
            tipe_mi_tertinggi: tipeMiTertinggi,
            skor_mi_tertinggi: skorMiTertinggi,
            tipe_riasec_tertinggi: tipeRiasecTertinggi,
            skor_riasec_tertinggi: skorRiasecTertinggi,
            semua_skor_mi: skorMi,
            semua_skor_riasec: skorRiasec,
            rekomendasi: rekom
        };
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m;
        });
    }

    function resetToForm() {
        if (confirm("Apakah Anda yakin ingin kembali ke halaman utama? Hasil tes tidak akan hilang karena sudah tersimpan di database.")) {

            document.getElementById('nama').value = '';
            document.getElementById('kelas').value = '';
            document.getElementById('sekolah').value = '';
            document.getElementById('cabang').value = '';
            
            document.getElementById('formIdentitas').style.display = 'block';
            document.getElementById('halamanTes').style.display = 'none';
            document.getElementById('halamanHasil').style.display = 'none';
        }
    }
    
    // ==================== ADMIN FUNCTIONS ====================
    function showAdminLogin() {
        document.getElementById('siswaPage').style.display = 'none';
        document.getElementById('adminLogin').style.display = 'block';
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('adminPassword').value = '';
    }
    
    function backToSiswa() {
        document.getElementById('siswaPage').style.display = 'block';
        document.getElementById('adminLogin').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'none';
        document.getElementById('changePasswordModal').style.display = 'none';
        document.getElementById('modalLaporan').style.display = 'none';
    }
    
    async function adminLogin() {
        const pwd = document.getElementById('adminPassword').value;
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getSetting`);
            const data = await res.json();
            if (data.success && data.data.admin_password === pwd) {
                adminToken = pwd;
                showToast("<i class='fa-solid fa-circle-check'></i> Login berhasil!");
                await loadAdminData();
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                showToast("Password salah!", true);
            }
        } catch (err) {
            if (pwd === "j4k@123") {
                adminToken = pwd;
                showToast("Login berhasil (mode demo)!");
                await loadAdminDataDemo();
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                showToast("Password salah!", true);
            }
        }
    }
    
    async function loadAdminData() {
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getAllHasil`);
            const data = await res.json();
            if (data.success && data.data) {
                renderAdminTable(data.data);
                populateFilterOptions(data.data);
            }
        } catch (err) {
            showToast("Gagal load data: " + err.message, true);
            loadAdminDataDemo();
        }
    }
    
    function loadAdminDataDemo() {
        const demoData = [
            { id_siswa: "DEMO_001", nama: "Muhammad Hazalitsa Amin", kelas: "9G", asal_sekolah: "SMPN 10 BEKASI", cabang: "Bekasi Raya", tipe_mi_tertinggi: "Visual-Spatial", tipe_riasec_tertinggi: "Artistic", tanggal: new Date().toLocaleDateString(), skor_mi_json: '{"Visual-Spatial":4.2,"Logical-Mathematical":3.1,"Linguistic":3.5,"Musical":3.8,"Interpersonal":3.9,"Intrapersonal":3.6,"Kinesthetic":3.4,"Naturalist":3.2}' },
            { id_siswa: "DEMO_002", nama: "Aisyah Putri", kelas: "11 IPA 2", asal_sekolah: "SMAN 1 Bekasi", cabang: "Bekasi Kota", tipe_mi_tertinggi: "Linguistic", tipe_riasec_tertinggi: "Social", tanggal: new Date().toLocaleDateString(), skor_mi_json: '{"Visual-Spatial":3.0,"Logical-Mathematical":3.1,"Linguistic":4.8,"Musical":3.5,"Interpersonal":4.2,"Intrapersonal":3.6,"Kinesthetic":2.4,"Naturalist":3.2}' }
        ];
        renderAdminTable(demoData);
        populateFilterOptions(demoData);
    }
    
    function renderAdminTable(data) {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '';
        for (const row of data) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id_siswa || '-'}</td>
                <td>${escapeHtml(row.nama || '-')}</td>
                <td>${escapeHtml(row.kelas || '-')}</td>
                <td>${escapeHtml(row.asal_sekolah || '-')}</td>
                <td>${escapeHtml(row.cabang || '-')}</td>
                <td><span class="badge">${row.tipe_mi_tertinggi || '-'}</span></td>
                <td><span class="badge">${row.tipe_riasec_tertinggi || '-'}</span></td>
                <td><button class="btn btn-secondary" style="padding: 8px 15px; font-size: 13px;" onclick="viewLaporan(this)" data-siswa='${JSON.stringify(row).replace(/'/g, "&#39;")}'><i class="fa-solid fa-eye"></i> Lihat</button></td>
            `;
            tbody.appendChild(tr);
        }
    }
    
    function populateFilterOptions(data) {
        const cabangSet = new Set();
        for (const row of data) if (row.cabang) cabangSet.add(row.cabang);
        const select = document.getElementById('filterCabang');
        select.innerHTML = '<option value="">Semua Cabang</option>';
        for (const c of cabangSet) {
            select.innerHTML += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`;
        }
    }
    
    function filterAdminTable() {
        const filterNama = document.getElementById('filterNama').value.toLowerCase();
        const filterKelas = document.getElementById('filterKelas').value.toLowerCase();
        const filterCabang = document.getElementById('filterCabang').value;
        const rows = document.querySelectorAll('#adminTable tbody tr');
        for (const row of rows) {
            const nama = row.cells[1]?.innerText.toLowerCase() || '';
            const kelas = row.cells[2]?.innerText.toLowerCase() || '';
            const cabang = row.cells[4]?.innerText || '';
            let show = true;
            if (filterNama && !nama.includes(filterNama)) show = false;
            if (filterKelas && !kelas.includes(filterKelas)) show = false;
            if (filterCabang && cabang !== filterCabang) show = false;
            row.style.display = show ? '' : 'none';
        }
    }
    
    function viewLaporan(btnElement) {
        showToast("<i class='fa-solid fa-spinner fa-spin'></i> Memuat laporan...");
        
        const hasilData = JSON.parse(btnElement.getAttribute('data-siswa'));
        
        let skorMi = {};
        if (hasilData.skor_mi_json) {
            try { skorMi = JSON.parse(hasilData.skor_mi_json); } catch(e) { console.log(e); }
        }
        
        // Fallback jika tidak ada data skor
        if (Object.keys(skorMi).length === 0) {
            skorMi = {
                "Visual-Spatial": 0, "Logical-Mathematical": 0, "Linguistic": 0,
                "Musical": 0, "Interpersonal": 0, "Intrapersonal": 0, "Kinesthetic": 0, "Naturalist": 0
            };
        }
        
        const rekom = mappingMi[hasilData.tipe_mi_tertinggi] || mappingMi["Visual-Spatial"];
        
        const modalContent = document.getElementById('modalLaporanContent');
        modalContent.innerHTML = `
            <div style="text-align: center; margin-bottom: 20px;">
                <h3 style="color:#2e7d32;">📊 HASIL TES MINAT & BAKAT</h3>
                <p><strong>${escapeHtml(hasilData.nama)}</strong> | Kelas: ${escapeHtml(hasilData.kelas)} | ${escapeHtml(hasilData.asal_sekolah)} | Cabang: ${escapeHtml(hasilData.cabang)}</p>
            </div>
            <div style="background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 20px; padding: 20px; text-align: center; margin-bottom: 20px;">
                <div class="badge">🎯 TIPE KECERDASAN DOMINAN</div>
                <div style="font-size: 32px; font-weight: 800; color: #2e7d32;">${hasilData.tipe_mi_tertinggi}</div>
                <div style="margin-top: 5px;">Tipe RIASEC: <strong>${hasilData.tipe_riasec_tertinggi}</strong></div>
            </div>
            
            <div class="info-card" style="margin-bottom: 15px;">
                <div class="badge"><i class="fa-solid fa-microscope"></i> Apa itu Kecerdasan ${hasilData.tipe_mi_tertinggi}?</div>
                <p style="line-height: 1.6; font-size: 14px;">${rekom.deskripsi}</p>
            </div>

            <div class="motivation-card">
                <div class="motivation-text" style="font-size: 16px;">${rekom.motivasi}</div>
                <div class="role-model-badge" style="font-size: 13px;">
                    <i class="fa-solid fa-star"></i> Tokoh: ${rekom.tokoh}
                </div>
            </div>
            
            <div class="result-grid" style="margin-top: 20px;">
                <div class="info-card"><div class="badge">💼 Pekerjaan</div><p style="font-size:14px;">${rekom.pekerjaan}</p></div>
                <div class="info-card"><div class="badge">🏫 Jurusan SMA</div><p style="font-size:14px;">${rekom.jurusan_sma}</p></div>
                <div class="info-card"><div class="badge">🎓 Jurusan Kuliah</div><p style="font-size:14px;">${rekom.jurusan_kuliah}</p></div>
                <div class="info-card"><div class="badge">📖 Ciri Umum</div><p style="font-size:14px;">${rekom.ciri}</p></div>
                <div class="info-card"><div class="badge">⚡ Cara Optimasi</div><p style="font-size:14px;">${rekom.optimasi}</p></div>
            </div>
            
            <div style="margin-top: 20px;">
                <h3 style="font-size:16px; margin-bottom:10px;">📊 Grafik Skor Multiple Intelligences</h3>
                <canvas id="modalChart" style="max-height: 250px;"></canvas>
            </div>
        `;
        
        document.getElementById('modalLaporan').style.display = 'flex';
        
        // Render chart
        setTimeout(() => {
            const ctx = document.getElementById('modalChart');
            if (ctx) {
                if (modalChartInstance) modalChartInstance.destroy();
                
                modalChartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(skorMi),
                        datasets: [{
                            label: 'Skor',
                            data: Object.values(skorMi),
                            backgroundColor: Object.keys(skorMi).map(label => label === hasilData.tipe_mi_tertinggi ? 'rgba(46, 125, 50, 0.9)' : 'rgba(76, 175, 80, 0.5)'),
                            borderRadius: 8
                        }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: true, 
                        scales: { y: { min: 0, max: 5 } }, 
                        plugins: { legend: { display: false } } 
                    }
                });
            }
        }, 200);
    }
    
    function closeModalLaporan() {
        document.getElementById('modalLaporan').style.display = 'none';
        if (modalChartInstance) { modalChartInstance.destroy(); modalChartInstance = null; }
    }
    
    async function printModalLaporan() {
        const element = document.getElementById('modalLaporanContent');
        if (!element.innerHTML.trim()) {
            showToast("Tidak ada data untuk dicetak!", true);
            return;
        }
        
        const originalTitle = document.title;
        document.title = `Laporan_PsikoRouter`;
        
        showToast("<i class='fa-solid fa-spinner fa-spin'></i> Menyiapkan PDF...");
        
        try {
            const canvas = await html2canvas(element, { scale: 2, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const imgWidth = 190;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            
            pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight > 270 ? 270 : imgHeight);
            pdf.save(`Laporan_PsikoRouter.pdf`);
            showToast("<i class='fa-solid fa-circle-check'></i> PDF berhasil diunduh!");
        } catch (err) {
            showToast("Gagal generate PDF: " + err.message, true);
        }
        document.title = originalTitle;
    }
    
    function refreshAdminData() { loadAdminData(); }
    
    function adminLogout() {
        adminToken = "";
        backToSiswa();
        showToast("<i class='fa-solid fa-circle-check'></i> Logout berhasil");
    }
    
    function showChangePassword() {
        document.getElementById('changePasswordModal').style.display = 'flex';
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
    }
    
    function closeChangePassword() { document.getElementById('changePasswordModal').style.display = 'none'; }
    
    async function updatePassword() {
        const oldPwd = document.getElementById('oldPassword').value;
        const newPwd = document.getElementById('newPassword').value;
        const confirmPwd = document.getElementById('confirmPassword').value;
        
        if (newPwd !== confirmPwd) { showToast("Password baru tidak cocok!", true); return; }
        if (newPwd.length < 4) { showToast("Password minimal 4 karakter!", true); return; }
        
        try {
            await fetch(APPS_SCRIPT_URL, {
                method: "POST", mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "updatePassword", password_baru: newPwd, admin_token: oldPwd })
            });
            showToast("<i class='fa-solid fa-circle-check'></i> Password berhasil diupdate!");
            closeChangePassword();
        } catch (err) {
            showToast("Gagal update password: " + err.message, true);
        }
    }
</script>
